<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lasoi Muntet</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #C8A2C8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            padding: 30px;
        }

        h1 {
            color: black;
            font-size: 4rem;
            margin-bottom: 10px;
        }

        .details {
            color: black;
            font-size: 1.2rem;
            margin-bottom: 25px;
        }

        .details span {
            font-weight: bold;
        }

        .message {
            color: #222;
            font-size: 1.4rem;
            max-width: 600px;
            line-height: 1.6;
            font-style: italic;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Lasoi Muntet</h1>

        <p class="details">
            Born in <span>July</span> • Around <span>8:00 PM</span>
        </p>

        <p class="message">
            “Mnipee pesa jamani 😭💜”
        </p>
    </div>

</body>
</html>
